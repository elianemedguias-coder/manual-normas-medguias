<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prova de Página — Manual de Normas MedGuias</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F8F6;
    --surface:#FFFFFF;
    --surface-2:#EEF4F1;
    --line:#DEE6E1;
    --green:#12805F;
    --green-dark:#0C6A4D;
    --green-tint:#E3F3EC;
    --red:#D6402F;
    --red-tint:#FBE7E4;
    --gold:#DDA23A;
    --gold-tint:#FBF0DE;
    --text:#173226;
    --text-dim:#5B6E64;
    --text-faint:#93A69C;
    --radius:20px;
    --radius-sm:10px;
    --shadow:0 2px 10px rgba(23,50,38,.06), 0 1px 2px rgba(23,50,38,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    line-height:1.5;
  }
  #app{max-width:720px;margin:0 auto;padding:32px 20px 80px;min-height:100vh;}
  h1,h2,h3{font-family:'Poppins',sans-serif;margin:0;}
  .mono{font-family:'Inter',sans-serif;}
  .eyebrow{
    font-size:12px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--green);
  }
  /* ---- card ---- */
  .proof{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:22px 22px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .proof .cm-tl,.proof .cm-bl,.proof .cm-br{display:none;}
  .proof::before{
    content:'';position:absolute;top:0;left:0;right:0;height:5px;
    background:linear-gradient(90deg, var(--green) 0%, var(--green) 60%, var(--red) 60%, var(--red) 100%);
  }

  /* ---- header / logo mark ---- */
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:32px;}
  .logomark{width:32px;height:32px;position:relative;flex:none;}
  .logomark .bar{position:absolute;background:var(--red);}
  .logomark .h{width:32px;height:11px;top:11px;left:0;}
  .logomark .v{width:11px;height:32px;top:0;left:11px;}
  .logomark .flag{
    position:absolute;top:11px;left:11px;width:16px;height:16px;
    background:var(--green);
    clip-path:polygon(0 0, 100% 0, 100% 100%);
  }
  .brand-text .title{font-family:'Poppins',sans-serif;font-size:18px;font-weight:700;color:var(--text);}
  .brand-text .sub{font-size:11px;color:var(--text-dim);font-weight:600;letter-spacing:.03em;}

  button{font-family:'Inter',sans-serif;cursor:pointer;}
  .btn{
    background:var(--green);
    color:#fff;
    border:none;
    padding:14px 26px;
    font-weight:800;
    font-size:14px;
    letter-spacing:.04em;
    text-transform:uppercase;
    border-radius:999px;
    transition:transform .08s ease, filter .1s ease, box-shadow .1s ease;
    box-shadow:0 2px 8px rgba(18,128,95,.24);
  }
  .btn:hover{filter:brightness(1.06);}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.4;cursor:default;}
  .btn.ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--text);box-shadow:none;}
  .btn.ghost:hover{border-color:var(--green);color:var(--green);}
  .btn.ghost:active{transform:scale(.97);}
  .btn.full{width:100%;}
  .btn.danger-outline{background:transparent;border:1.5px solid var(--red);color:var(--red);box-shadow:none;}
  .btn.cta{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    text-transform:none;letter-spacing:0;font-size:14.5px;font-weight:700;
    padding:8px 8px 8px 24px;
  }
  .btn.cta::after{
    content:'→';flex:none;width:34px;height:34px;border-radius:50%;
    background:#fff;color:var(--green);display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:800;
  }
  .btn.ghost.cta::after{background:var(--green);color:#fff;}

  input{
    width:100%;
    background:var(--surface-2);
    border:1.5px solid var(--line);
    color:var(--text);
    padding:12px 14px;
    font-size:14px;
    border-radius:var(--radius-sm);
    font-family:'Inter',sans-serif;
    margin-bottom:12px;
  }
  input:focus{outline:2px solid var(--green);outline-offset:1px;}
  label{font-size:12.5px;color:var(--text-dim);display:block;margin-bottom:6px;font-weight:600;}

  .tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:1px solid var(--line);}
  .tab{padding:10px 4px;margin-right:24px;background:none;border:none;color:var(--text-dim);font-size:14px;font-weight:700;border-bottom:2px solid transparent;font-family:'Inter',sans-serif;}
  .tab.active{color:var(--green);border-bottom-color:var(--green);}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;gap:10px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line);}
  .navbtn{background:none;border:none;color:var(--text-dim);font-size:12.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:8px 0;}
  .navbtn:hover{color:var(--text);}
  .navbtn.active{color:var(--green);}
  .navgroup{display:flex;gap:22px;align-items:center;}
  .navbtn.pill-out{
    border:1.5px solid var(--line);border-radius:999px;padding:8px 18px;color:var(--text-dim);
  }
  .navbtn.pill-out:hover{border-color:var(--red);color:var(--red);}

  /* dashboard unit card */
  .unit-card{display:flex;align-items:center;gap:16px;cursor:pointer;}
  .unit-card:hover{box-shadow:0 4px 16px rgba(23,50,38,.1);}
  .unit-tag{
    font-size:12px;font-weight:800;color:var(--green);
    background:var(--green-tint);
    border-radius:999px;
    padding:5px 11px;
    flex:none;
    white-space:nowrap;
  }
  .unit-info{flex:1;min-width:0;}
  .unit-info .t{font-weight:700;font-size:15.5px;margin-bottom:2px;font-family:'Poppins',sans-serif;}
  .unit-info .d{font-size:12.5px;color:var(--text-dim);}
  .unit-score{flex:none;text-align:right;}
  .unit-score .pts{font-size:16px;font-weight:800;color:var(--green);font-family:'Poppins',sans-serif;}
  .unit-score .of{font-size:10px;color:var(--text-faint);font-weight:700;letter-spacing:.03em;}
  .unit-score.empty .pts{color:var(--text-faint);}

  /* content render */
  .content h1{font-size:23px;margin:0 0 18px;color:var(--text);font-weight:800;}
  .content p{font-size:14.5px;color:#3C4E45;margin:0 0 13px;line-height:1.65;}
  .content strong{color:var(--text);}
  .content ul{margin:0 0 16px;padding-left:0;list-style:none;}
  .content li{font-size:14px;color:#3C4E45;padding-left:24px;position:relative;margin-bottom:8px;line-height:1.5;}
  .content li::before{
    content:'✓';position:absolute;left:0;top:0;color:var(--green);font-weight:800;font-size:12px;
    width:16px;height:16px;background:var(--green-tint);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .content code{
    font-family:'Inter',monospace;
    background:var(--green-tint);
    padding:2px 7px;
    font-size:12.5px;
    color:var(--green-dark);
    border-radius:5px;
    font-weight:600;
  }
  .content table{
    width:100%;border-collapse:separate;border-spacing:0;margin:0 0 18px;font-size:13px;
    border-radius:14px;overflow:hidden;border:2px solid var(--line);
  }
  .content th,.content td{text-align:left;padding:10px 12px;}
  .content th{color:#fff;background:var(--green);font-weight:700;font-family:'Poppins',sans-serif;}
  .content td{border-top:1px solid var(--line);}
  .content tbody tr:nth-child(even) td{background:var(--surface-2);}
  .content .callout{
    background:var(--red-tint);border:2px solid var(--red);
    padding:14px 16px;border-radius:16px;font-size:13.5px;
    margin:0 0 16px;color:#7A2A20;font-weight:700;
    display:flex;gap:8px;align-items:flex-start;
  }
  .content .callout::before{content:'⚠️';flex:none;}
  .content details.example{
    background:var(--surface);border:2px solid var(--green);
    border-radius:16px;margin:0 0 16px;padding:4px 16px;
    box-shadow:var(--shadow);
  }
  .content details.example summary{
    cursor:pointer;font-weight:800;color:var(--green-dark);font-size:14px;
    list-style:none;padding:12px 0;font-family:'Poppins',sans-serif;
    display:flex;align-items:center;gap:8px;
  }
  .content details.example summary::-webkit-details-marker{display:none;}
  .content details.example summary::before{
    content:'▸';color:#fff;background:var(--green);width:20px;height:20px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:11px;flex:none;
    transition:transform .15s;
  }
  .content details.example[open] summary::before{transform:rotate(90deg);}
  .content details.example .example-body{margin:0 0 14px;padding-top:4px;border-top:1px dashed var(--line);}
  .content details.example .example-body p{margin:12px 0 8px;font-size:13.5px;}
  .content details.example .example-body ul{margin:0 0 8px;}
  .content details.example .example-body li{color:#2C4A3B;}
  .content-img{width:100%;border-radius:12px;border:2px solid var(--line);display:block;margin:0 0 10px;box-shadow:var(--shadow);}

  /* full-bleed chapter sections (Samsung-style panels) */
  .content .chapter{
    width:100vw;position:relative;left:50%;right:50%;
    margin-left:-50vw;margin-right:-50vw;margin-top:0;margin-bottom:0;
    padding:46px 20px;
  }
  .content .chapter.tint-a{background:var(--surface);}
  .content .chapter.tint-b{background:var(--green-tint);}
  .content .chapter-inner{max-width:680px;margin:0 auto;}
  .content .chapter h2{
    font-size:24px;margin:0 0 18px;color:var(--text);font-weight:800;
    font-family:'Poppins',sans-serif;line-height:1.2;
    display:flex;align-items:center;gap:10px;
  }
  .content .chapter h2::before{
    content:'';width:10px;height:34px;border-radius:5px;background:var(--red);flex:none;
  }
  @media (min-width: 640px){
    .content .chapter{padding:64px 32px;}
    .content .chapter h2{font-size:28px;}
  }

  /* unit page header badge */
  .unit-head{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
  .unit-badge{
    width:44px;height:44px;border-radius:50%;flex:none;
    background:var(--green);color:#fff;font-family:'Poppins',sans-serif;font-weight:800;font-size:15px;
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(18,128,95,.28);
  }
  .unit-head h1{margin:0;font-size:21px;}

  /* quiz */
  .qprogress{display:flex;gap:4px;margin-bottom:22px;}
  .qprogress i{flex:1;height:5px;background:var(--line);border-radius:3px;}
  .qprogress i.done{background:var(--green);}
  .qprogress i.wrong{background:var(--red);}
  .qtext{font-size:18px;font-weight:700;margin-bottom:18px;line-height:1.4;font-family:'Poppins',sans-serif;color:var(--text);}
  .opt{
    display:block;width:100%;text-align:left;
    background:var(--surface);
    border:1.5px solid var(--line);
    color:var(--text);
    padding:14px 18px;
    font-size:14.5px;
    font-weight:700;
    margin-bottom:10px;
    border-radius:20px;
    box-shadow:var(--shadow);
    transition:border-color .12s, transform .08s, box-shadow .1s;
  }
  .opt:hover:not(:disabled){border-color:var(--green);}
  .opt:active:not(:disabled){transform:scale(.98);}
  .opt:disabled{cursor:default;}
  .opt.correct{border-color:var(--green);background:var(--green-tint);color:var(--green-dark);}
  .opt.wrong{border-color:var(--red);background:var(--red-tint);color:var(--red);}
  .feedback{
    margin-top:16px;padding:16px 18px;
    border-radius:16px;
    font-size:14px;
    background:var(--green);color:#fff;
  }
  .feedback strong{display:block;font-family:'Poppins',sans-serif;font-size:16px;margin-bottom:3px;}
  .feedback .fb-text{font-weight:500;font-size:13px;opacity:.95;}
  .feedback.bad{background:var(--red);}
  .qfooter{margin-top:20px;display:flex;justify-content:flex-end;}

  .summary{text-align:center;padding:20px 0;}
  .summary .big{font-family:'Poppins',sans-serif;font-size:46px;font-weight:800;color:var(--green);margin:14px 0 6px;}
  .summary .sub{color:var(--text-dim);font-size:13px;margin-bottom:26px;font-weight:600;}

  /* ranking */
  .rank-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);}
  .rank-row:last-child{border-bottom:none;}
  .rank-pos{font-size:14px;font-weight:800;color:var(--text-faint);width:26px;flex:none;text-align:center;}
  .rank-row.top .rank-pos{color:#fff;background:var(--red);border-radius:50%;width:24px;height:24px;line-height:24px;font-size:12px;}
  .rank-name{flex:1;font-size:14.5px;font-weight:600;}
  .rank-pts{font-size:14.5px;color:var(--green);font-weight:800;font-family:'Poppins',sans-serif;}

  .empty-state{text-align:center;padding:40px 20px;color:var(--text-dim);font-size:13.5px;}
  .error-msg{color:var(--red);font-size:13px;margin:-4px 0 12px;font-weight:600;}
  .loading{text-align:center;padding:60px 0;color:var(--text-dim);font-weight:700;font-size:13px;letter-spacing:.03em;}

  /* skeleton loading */
  .skel{background:linear-gradient(90deg, var(--surface-2) 25%, var(--line) 37%, var(--surface-2) 63%);background-size:400% 100%;animation:skel-shine 1.4s ease infinite;border-radius:16px;}
  @keyframes skel-shine{0%{background-position:100% 0;}100%{background-position:0 0;}}
  .skel-row{display:flex;gap:10px;margin-bottom:12px;}
  .skel-chip{flex:1;height:56px;border-radius:16px;}
  .skel-tile{height:118px;border-radius:22px;}

  /* toasts */
  .toast-wrap{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
  .toast{
    background:var(--text);color:#fff;font-weight:600;font-size:13px;
    padding:10px 18px;border-radius:999px;box-shadow:var(--shadow);
    opacity:0;transform:translateY(-10px);animation:toast-in .25s ease forwards, toast-out .3s ease forwards 2.3s;
    white-space:nowrap;
  }
  @keyframes toast-in{to{opacity:1;transform:translateY(0);}}
  @keyframes toast-out{to{opacity:0;transform:translateY(-10px);}}

  /* ripple */
  .ripple-host{position:relative;overflow:hidden;}
  .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:ripple-anim .5s ease-out;pointer-events:none;}
  .opt .ripple{background:rgba(18,128,95,.18);}
  @keyframes ripple-anim{to{transform:scale(2.6);opacity:0;}}

  /* card entrance animation */
  @keyframes fade-up{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .fade-up{animation:fade-up .35s ease both;}

  /* progress bar */
  .xp-bar{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;}
  .xp-bar-fill{height:100%;border-radius:999px;background:var(--green);width:0;transition:width .6s cubic-bezier(.2,.8,.2,1);}

  /* avatar */
  .avatar-circle{
    width:30px;height:30px;border-radius:50%;background:var(--green-tint);color:var(--green-dark);
    display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-weight:700;
    font-size:14px;flex:none;border:1.5px solid var(--surface);box-shadow:var(--shadow);cursor:pointer;
    transition:transform .1s;
  }
  .avatar-circle:hover{transform:scale(1.08);}

  /* avatar picker modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(23,50,38,.45);z-index:90;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .modal-card{
    background:#fff;border-radius:24px;padding:24px 22px;max-width:340px;width:100%;
    box-shadow:0 10px 40px rgba(23,50,38,.25);max-height:80vh;overflow-y:auto;
  }
  .modal-card h3{font-family:'Poppins',sans-serif;font-size:17px;font-weight:700;margin:0 0 4px;color:var(--text);}
  .modal-card .sub{font-size:12.5px;color:var(--text-dim);margin-bottom:16px;}
  .avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
  .avatar-opt{
    width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:26px;cursor:pointer;border:2.5px solid transparent;transition:transform .1s;
  }
  .avatar-opt:hover{transform:scale(1.08);}
  .avatar-opt.selected{border-color:var(--green);}

  /* crowns */
  .avatar-circle{position:relative;}
  .crown-badge{
    position:absolute;top:-11px;left:50%;transform:translateX(-50%);
    font-size:15px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));
  }
  .crown-overlay .modal-card{text-align:center;}
  .crown-big{
    width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:50px;margin:4px auto 16px;animation:crown-pop .5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes crown-pop{0%{transform:scale(0);}70%{transform:scale(1.15);}100%{transform:scale(1);}}

  /* streak / level chips */
  .gami-row{display:flex;gap:8px;margin-bottom:14px;}
  .gami-chip{
    flex:1;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
    border-radius:16px;padding:10px 8px;text-align:center;
  }
  .gami-chip .v{font-family:'Poppins',sans-serif;font-size:16px;font-weight:700;color:var(--text);}
  .gami-chip .l{font-size:9.5px;color:var(--text-dim);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}

  /* achievements */
  .badges-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .badge-ico{
    width:38px;height:38px;border-radius:50%;background:var(--gold-tint);color:#7A5417;
    display:flex;align-items:center;justify-content:center;font-size:17px;
    border:1.5px solid var(--gold);
  }
  .badge-ico.locked{background:var(--surface-2);color:var(--text-faint);border-color:var(--line);opacity:.5;}
  .backlink{background:none;border:none;color:var(--text-dim);font-size:13px;font-weight:700;margin-bottom:18px;padding:0;}
  .backlink:hover{color:var(--green);}

  /* stats bar */
  .stats-bar{display:flex;gap:10px;margin-bottom:22px;}
  .stat-chip{
    flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--surface);border:1px solid var(--line);
    box-shadow:var(--shadow);
    border-radius:16px;padding:12px 10px;
  }
  .stat-chip .ico{font-size:20px;line-height:1;}
  .stat-chip .num{font-family:'Poppins',sans-serif;font-size:20px;font-weight:800;color:var(--green);line-height:1;}
  .stat-chip .lbl{font-size:10px;color:var(--text-dim);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}

  /* organic unit grid */
  .blob-bg{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
  .blob-bg svg{position:absolute;}
  .hero-wrap{position:relative;padding:4px 0 6px;overflow:hidden;}
  .hero-inner{position:relative;z-index:1;}

  .unit-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:4px;}
  .unit-tile{
    grid-column:span 1;
    border-radius:22px;padding:16px;position:relative;min-height:118px;
    display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;
    transition:transform .12s ease;border:none;
  }
  .unit-tile.wide{grid-column:span 2;min-height:88px;flex-direction:row;align-items:center;justify-content:space-between;}
  .unit-tile:active{transform:scale(.97);}
  .unit-tile .tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;opacity:.7;}
  .unit-tile .t{font-family:'Poppins',sans-serif;font-weight:700;font-size:14.5px;line-height:1.25;margin-top:4px;}
  .unit-tile .pts{font-size:11px;font-weight:800;margin-top:8px;}
  .unit-tile .arrow-circle{
    width:30px;height:30px;border-radius:50%;background:#fff;flex:none;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;
  }
  .unit-tile:not(.wide) .arrow-circle{position:absolute;bottom:14px;right:14px;}
  .unit-tile.tint-green{background:var(--green-tint);color:var(--green-dark);}
  .unit-tile.tint-green .arrow-circle{color:var(--green-dark);}
  .unit-tile.tint-gold{background:var(--gold-tint);color:#7A5417;}
  .unit-tile.tint-gold .arrow-circle{color:#7A5417;}

// ---------------- tiny markdown renderer ----------------
function mdToHtml(md){
  const lines = md.split("\n");
  let html = "";
  let inList = false, inTable = false, tableRows = [];
  let inExample = false, exampleTitle = "", exampleBuf = [];
  let chapterOpen = false, chapterIdx = 0;
  const inline = (s) => s
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`(.+?)`/g, "<code>$1</code>");
  const closeList = () => { if(inList){ html += "</ul>"; inList=false; } };
  const closeTable = () => {
    if(inTable){
      const [header, ...rows] = tableRows;
      html += "<table><thead><tr>" + header.map(c=>`<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>";
      rows.forEach(r => { html += "<tr>" + r.map(c=>`<td>${inline(c)}</td>`).join("") + "</tr>"; });
      html += "</tbody></table>";
      inTable = false; tableRows = [];
    }
  };
  const closeExample = () => {
    if(inExample){
      html += `<details class="example"><summary>${inline(exampleTitle)}</summary><div class="example-body">`;
      let listOpen = false;
      exampleBuf.forEach(l => {
        const t = l.trim();
        if(t === ""){ if(listOpen){ html+="</ul>"; listOpen=false; } return; }
        const imgMatch = t.match(/^!\[(.*?)\]\((.*?)\)$/);
        if(imgMatch){
          if(listOpen){ html+="</ul>"; listOpen=false; }
          html += `<img class="content-img" src="${imgMatch[2]}" alt="${imgMatch[1].replace(/"/g,'&quot;')}" loading="lazy" />`;
          return;
        }
        if(t.startsWith("- ") || t.startsWith("✅") || t.startsWith("❌")){
          if(!listOpen){ html+="<ul>"; listOpen=true; }
          html += `<li>${inline(t.startsWith("- ") ? t.slice(2) : t)}</li>`;
        } else {
          if(listOpen){ html+="</ul>"; listOpen=false; }
          html += `<p>${inline(t)}</p>`;
        }
      });
      if(listOpen) html += "</ul>";
      html += `</div></details>`;
      inExample = false; exampleTitle = ""; exampleBuf = [];
    }
  };
  const closeChapter = () => { if(chapterOpen){ html += `</div></section>`; chapterOpen = false; } };
  const openChapter = (headingHtml) => {
    closeChapter();
    chapterIdx++;
    const tint = chapterIdx % 2 === 0 ? "tint-b" : "tint-a";
    html += `<section class="chapter ${tint}"><div class="chapter-inner">${headingHtml}`;
    chapterOpen = true;
  };
  for(let raw of lines){
    const line = raw.trim();
    if(inExample){
      if(line === "::"){ closeExample(); continue; }
      exampleBuf.push(raw);
      continue;
    }
    if(line === ""){ closeList(); closeTable(); continue; }
    if(line.startsWith("::exemplo ")){
      closeList(); closeTable();
      inExample = true;
      exampleTitle = line.slice(10).trim();
      exampleBuf = [];
      continue;
    }
    if(line.startsWith("!! ")){
      closeList(); closeTable();
      html += `<div class="callout">${inline(line.slice(3))}</div>`;
      continue;
    }
    if(line.startsWith("# ")){ closeList(); closeTable(); html += `<h1>${inline(line.slice(2))}</h1>`; continue; }
    if(line.startsWith("## ")){
      closeList(); closeTable();
      openChapter(`<h2>${inline(line.slice(3))}</h2>`);
      continue;
    }
    if(line.startsWith("|")){
      if(/^\|[\s-:|]+\|$/.test(line)){ continue; } // separator row
      closeList();
      const cells = line.split("|").slice(1,-1).map(c=>c.trim());
      tableRows.push(cells); inTable = true; continue;
    }
    closeTable();
    const imgMatch = line.match(/^!\[(.*?)\]\((.*?)\)$/);
    if(imgMatch){
      closeList();
      html += `<img class="content-img" src="${imgMatch[2]}" alt="${imgMatch[1].replace(/"/g,'&quot;')}" loading="lazy" />`;
      continue;
    }
    if(line.startsWith("- ") || line.startsWith("✅") || line.startsWith("❌")){
      if(!inList){ html += "<ul>"; inList = true; }
      html += `<li>${inline(line.startsWith("- ") ? line.slice(2) : line)}</li>`;
      continue;
    }
    closeList();
    html += `<p>${inline(line)}</p>`;
  }
  closeList(); closeTable(); closeExample(); closeChapter();
  return html;
}

          <div class="mascot-bubble-big" id="mascot-bubble">Oi! Pronto pra revisar as normas dos impressos?</div>
        </div>
      </div>
    </div>
    <div class="proof"><div class="cm-bl"></div><div class="cm-br"></div>
      <div class="eyebrow" style="margin-bottom:16px;">ACESSO RESTRITO À EQUIPE</div>
      <div id="auth-error" class="error-msg" style="display:none;"></div>
      <label>Email</label>
      <input type="email" id="f-email" placeholder="voce@medguias.com.br" />
      <label>Senha</label>
      <input type="password" id="f-pass" placeholder="••••••••" />
      <button class="btn full cta" id="btn-login">Entrar</button>
      <div style="margin-top:14px;font-size:12px;color:var(--text-faint);">Não tem conta? Peça ao responsável pelo manual para criar a sua.</div>
    </div>
  `;
  const sadReact = (msg) => {
    document.getElementById("mascot-big").innerHTML = mascotSVG(72, "sad");
    document.getElementById("mascot-bubble").textContent = msg;
  };
  const showErr = (msg) => { const e=document.getElementById("auth-error"); e.textContent=msg; e.style.display="block"; };
  document.getElementById("btn-login").onclick = async () => {
    const email = document.getElementById("f-email").value.trim();
    const password = document.getElementById("f-pass").value;
    if(!email || !password){ showErr("Preencha email e senha."); sadReact("Ops, faltou preencher algo ali em cima!"); return; }
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ showErr(traduzErro(error.message)); sadReact("Hmm, não bateu. Confere o email e a senha!"); return; }
    state.session = data.session;
    state.justLoggedIn = true;
    await boot();
  };
}
function traduzErro(msg){
  if(/already registered/i.test(msg)) return "Esse email já tem uma conta. Tente entrar.";
  if(/invalid login credentials/i.test(msg)) return "Email ou senha incorretos.";
  if(/password/i.test(msg)) return "Senha inválida (mínimo 6 caracteres).";
  return msg;
}

// ---------------- TOPBAR (logged-in views) ----------------
function initialsOfName(nome){
  return (nome||"").trim().split(/\s+/).map(s=>s[0]).slice(0,2).join("").toUpperCase();
}
function topbar(active){
  const nome = state.profile?.nome || "";
  const avatarContent = state.profile?.avatar || initialsOfName(nome);
  const crown = bestCrown();
  const crownBadge = crown ? `<span class="crown-badge" style="color:${CROWNS[crown].color};" title="${CROWNS[crown].label}">👑</span>` : "";
  return `
  <div class="topbar">
    ${brandHeader()}
    <div class="navgroup">
      <button class="navbtn ${active==='dashboard'?'active':''}" id="nav-dash">UNIDADES</button>
      <button class="navbtn ${active==='ranking'?'active':''}" id="nav-rank">RANKING</button>
      <div class="avatar-circle" id="avatar-btn" title="Trocar avatar">${avatarContent}${crownBadge}</div>
      <button class="navbtn pill-out" id="nav-out">SAIR</button>
    </div>
  </div>`;
}
function wireTopbar(){
  document.getElementById("nav-dash").onclick = () => { state.view="dashboard"; render(); };
  document.getElementById("nav-rank").onclick = async () => { await loadRanking(); state.view="ranking"; render(); };
  document.getElementById("nav-out").onclick = async () => { await sb.auth.signOut(); location.reload(); };
  document.getElementById("avatar-btn").onclick = openAvatarPicker;
}

// ---------------- DASHBOARD ----------------
function renderDashboard(){
  const totalPts = state.progresso.reduce((s,p) => s + p.pontos, 0);
  const doneCount = state.progresso.length;
  const xp = state.profile?.pontos_total || totalPts;
  const lvl = levelInfo(xp);
  const streak = state.profile?.streak_count || 0;
  const medalhas = state.profile?.medalhas || [];
  const tints = ["tint-green","tint-gold","tint-red"];
  const tiles = state.unidades.map((u,i) => {
    const prog = state.progresso.find(p => p.unidade_id === u.id);
    const isCurrent = !prog && i === doneCount;
    let cls = tints[i % tints.length];
    if(prog) cls = "done";
    else if(isCurrent) cls = "solid-green wide";
    const rightHtml = prog
      ? (prog.coroa
          ? `<div class="check" style="background:${CROWNS[prog.coroa].bg};color:${CROWNS[prog.coroa].color};" title="${CROWNS[prog.coroa].label}">👑</div>`
          : `<div class="check">✓</div>`)
      : `<div class="arrow-circle">→</div>`;
    return `
      <div class="unit-tile ${cls} fade-up" style="animation-delay:${i*0.05}s" data-id="${u.id}">
        <div>
          <div class="tag">UNIDADE ${String(u.ordem).padStart(2,"0")}</div>
          <div class="t">${u.titulo}</div>
          ${prog ? `<div class="pts">${prog.pontos} pts</div>` : ""}
        </div>
        ${rightHtml}
      </div>`;
  }).join("");

  const welcomeHtml = state.justLoggedIn ? `
    <div class="welcome-banner">
      ${mascotSVG(36, "happy")}
      <div class="txt">Bem-vindo(a) de volta, ${(state.profile?.nome||"").split(" ")[0]}! Vamos treinar?</div>
    </div>` : "";
  state.justLoggedIn = false;

  const badgesHtml = Object.keys(BADGES).map(key => {
    const unlocked = medalhas.includes(key);
    const b = BADGES[key];
    return `<div class="badge-ico ${unlocked?'':'locked'}" title="${b.nome} — ${b.desc}">${b.icon}</div>`;
  }).join("");

  el.innerHTML = `
    ${topbar("dashboard")}
    <div class="hero-wrap">
      ${blobsBg()}
      <div class="hero-inner">
        ${welcomeHtml}
        <div class="eyebrow" style="margin-bottom:10px;">OLÁ, ${(state.profile?.nome||"").toUpperCase()}</div>
        <div class="gami-row">
          <div class="gami-chip"><div class="v">🔥 ${streak}</div><div class="l">Sequência</div></div>
          <div class="gami-chip"><div class="v">🏆 Nv.${lvl.level}</div><div class="l">Nível</div></div>
          <div class="gami-chip"><div class="v">⭐ ${xp}</div><div class="l">XP total</div></div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <span style="font-size:11px;color:var(--text-dim);font-weight:700;">NÍVEL ${lvl.level}</span>
          <span style="font-size:11px;color:var(--text-dim);font-weight:700;">${lvl.into}/100 XP</span>
        </div>
        <div class="xp-bar" style="margin-bottom:16px;"><div class="xp-bar-fill" id="xp-fill" style="width:0"></div></div>
        <div class="badges-row">${badgesHtml}</div>
      </div>
    </div>
    <div class="unit-grid">${tiles || `<div class="empty-state">Nenhuma unidade cadastrada ainda.</div>`}</div>
  `;
  requestAnimationFrame(() => {
    const fill = document.getElementById("xp-fill");
    if(fill) fill.style.width = (lvl.pct*100) + "%";
  });
  wireTopbar();
  el.querySelectorAll(".unit-tile").forEach(c => {
    c.onclick = async () => {
      state.currentUnidade = state.unidades.find(u => u.id === c.dataset.id);
      state.view = "unit";
      render();
    };
  });
}

// ---------------- UNIT VIEW ----------------
function renderUnit(){
  if(state._unitScrollHandler){
    window.removeEventListener("scroll", state._unitScrollHandler);
    state._unitScrollHandler = null;
  }
  const u = state.currentUnidade;
  const prog = state.progresso.find(p => p.unidade_id === u.id);
  const bodyMd = u.conteudo.replace(/^#\s+.*\n+/, ""); // strip leading H1, we render the title in the badge header instead
  el.innerHTML = `
    ${topbar("dashboard")}
    <button class="backlink" id="back">← VOLTAR ÀS UNIDADES</button>
    <div class="unit-head">
      <div class="unit-badge">U${String(u.ordem).padStart(2,"0")}</div>
      <h1>${u.titulo}</h1>
    </div>
    <div class="content">${mdToHtml(bodyMd)}</div>
    <button class="btn full cta" id="start-quiz">${prog ? "Refazer quiz — " + prog.pontos + " pts" : "Iniciar quiz"}</button>
    ${floatingMascot("unit-mascot", "happy", "Vamos estudar essa unidade!")}
  `;
  document.getElementById("back").onclick = () => {
    if(state._unitScrollHandler){ window.removeEventListener("scroll", state._unitScrollHandler); state._unitScrollHandler = null; }
    state.view="dashboard"; render();
  };
  document.getElementById("start-quiz").onclick = async () => {
    if(state._unitScrollHandler){ window.removeEventListener("scroll", state._unitScrollHandler); state._unitScrollHandler = null; }
    const { data, error } = await sb.from("perguntas").select("*").eq("unidade_id", u.id).order("ordem");
    if(error || !data || !data.length){ alert("Não há perguntas cadastradas para essa unidade ainda."); return; }
    state.perguntas = data;
    state.quizIndex = 0;
    state.quizScore = 0;
    state.answered = null;
    state.view = "quiz";
    render();
  };
  const readMessages = [
    { at: 0, mood: "happy", msg: "Vamos estudar essa unidade!" },
    { at: 0.3, mood: "happy", msg: "Boa, continua lendo!" },
    { at: 0.7, mood: "happy", msg: "Quase lá, tá indo bem!" },
    { at: 0.97, mood: "happy", msg: "Terminou! Bora pro quiz?" },
  ];
  let lastStep = -1;
  const onScroll = () => {
    const doc = document.documentElement;
    const scrollable = doc.scrollHeight - window.innerHeight;
    const pct = scrollable > 0 ? Math.min(1, window.scrollY / scrollable) : 1;
    let step = 0;
    readMessages.forEach((m,i) => { if(pct >= m.at) step = i; });
    if(step !== lastStep){
      lastStep = step;
      const m = readMessages[step];
      updateFloatingMascot("unit-mascot", m.mood, m.msg);
    }
  };
  window.addEventListener("scroll", onScroll, { passive: true });
  state._unitScrollHandler = onScroll;
}

// ---------------- QUIZ VIEW ----------------
function renderQuiz(){
  const total = state.perguntas.length;
  if(state.quizIndex >= total){
    const pontos = state.quizScore * 10;
    const pct = total ? state.quizScore / total : 0;
    const tier = pct === 1 ? "Perfeito! 🎯" : pct >= 0.7 ? "Mandou muito bem!" : pct >= 0.4 ? "Bom começo!" : "Vamos revisar de novo?";
    const confetti = Array.from({length: 20}).map((_,i) =>
      `<span class="confetti c${i % 6}" style="left:${(i * 5.2) % 100}%; animation-delay:${(i % 6) * 0.12}s"></span>`
    ).join("");
    const finalMood = pct >= 0.7 ? "happy" : "sad";
    el.innerHTML = `
      <div class="confetti-wrap">${confetti}</div>
      ${topbar("dashboard")}
      <div class="proof summary"><div class="cm-bl"></div><div class="cm-br"></div>
        <div class="eyebrow">UNIDADE CONCLUÍDA</div>
        <div class="big">${state.quizScore}/${total}</div>
        <div class="tier">${tier}</div>
        <div class="sub">${pontos} PONTOS NESTA TENTATIVA</div>
        <button class="btn full cta" id="save-continue">Salvar e voltar às unidades</button>
      </div>
      ${floatingMascot("quiz-mascot", finalMood, pct >= 0.7 ? "Mandou bem, parabéns!" : "Dá uma revisada e tenta de novo!")}
    `;
    if(pct === 1) unlockBadge("perfeito");
    document.getElementById("save-continue").onclick = async () => {
      const coroaNova = await salvarProgresso(pontos);
      if(coroaNova){
        showCrownCelebration(coroaNova);
      } else {
        state.view = "dashboard";
        render();
      }
    };
    return;
  }

  const q = state.perguntas[state.quizIndex];
  const alts = typeof q.alternativas === "string" ? JSON.parse(q.alternativas) : q.alternativas;
  const answered = state.answered;

  el.innerHTML = `
    ${topbar("dashboard")}
    <div class="qprogress">
      ${state.perguntas.map((_,i) => {
        let cls = "";
        if(i < state.quizIndex) cls = "done";
        return `<i class="${cls}"></i>`;
      }).join("")}
    </div>
    <div class="eyebrow">PERGUNTA ${state.quizIndex+1} DE ${total}</div>
    <div class="qtext">${q.pergunta}</div>
    <div id="opts">
      ${alts.map((a,i) => `<button class="opt" data-i="${i}">${a}</button>`).join("")}
    </div>
    <div id="feedback"></div>
    <div class="qfooter">
      <button class="btn" id="next-btn" style="display:none;">${state.quizIndex+1===total ? "Ver resultado" : "Próxima"}</button>
    </div>
    ${floatingMascot("quiz-mascot", "happy", "Escolhe a alternativa certa!")}
  `;

  el.querySelectorAll(".opt").forEach(btn => {
    btn.onclick = () => {
      if(state.answered !== null) return;
      const i = parseInt(btn.dataset.i);
      state.answered = i;
      const correct = i === q.resposta_correta;
      if(correct) state.quizScore++;
      el.querySelectorAll(".opt").forEach(b => {
        b.disabled = true;
        const bi = parseInt(b.dataset.i);
        if(bi === q.resposta_correta) b.classList.add("correct");
        else if(bi === i) b.classList.add("wrong");
      });
      const fb = document.getElementById("feedback");
      fb.innerHTML = `<div class="feedback ${correct?'':'bad'}"><strong>${correct?'Boa! 🎉':'Não é bem assim.'}</strong><div class="fb-text">${q.explicacao || ""}</div></div>`;
      updateFloatingMascot("quiz-mascot", correct ? "happy" : "sad", correct ? "Boa! Manda a próxima." : "Vish, dá uma olhada na explicação.");
      document.getElementById("next-btn").style.display = "inline-block";
    };
  });

  document.getElementById("next-btn").onclick = () => {
    state.quizIndex++;
    state.answered = null;
    render();
  };
}

async function salvarProgresso(pontosNovaTentativa){
  const u = state.currentUnidade;
  const existente = state.progresso.find(p => p.unidade_id === u.id);
  const melhor = existente ? Math.max(existente.pontos, pontosNovaTentativa) : pontosNovaTentativa;
  const tentativaAtual = (existente?.tentativas || 0) + 1;
  const total = state.perguntas.length;
  const acertouTudo = total > 0 && state.quizScore === total;
  let coroa = existente?.coroa || null;
  let coroaNova = null;
  if(acertouTudo && !coroa){
    coroaNova = crownForAttempt(tentativaAtual);
    if(coroaNova) coroa = coroaNova;
  }
  const payload = { pontos: melhor, concluido: true, tentativas: tentativaAtual, coroa, updated_at: new Date().toISOString() };

  if(existente){
    await sb.from("progresso").update(payload).eq("id", existente.id);
  } else {
    await sb.from("progresso").insert({ usuario_id: state.session.user.id, unidade_id: u.id, ...payload });
  }
  await loadProgresso();
  const totalPontos = state.progresso.reduce((s,p) => s + p.pontos, 0);
  await sb.from("perfis").update({ pontos_total: totalPontos }).eq("id", state.session.user.id);
  state.profile.pontos_total = totalPontos;
  checkAchievements();
  return coroaNova;
}

// ---------------- RANKING VIEW ----------------
function renderRanking(){
  const top3 = state.ranking.slice(0,3);
  const rest = state.ranking.slice(3);
  const podiumOrder = [1,0,2]; // display order: 2nd, 1st, 3rd
  const initialsOf = (nome) => (nome||"").trim().split(/\s+/).map(s=>s[0]).slice(0,2).join("").toUpperCase();

  const podiumHtml = top3.length ? `
    <div class="podium">
      ${podiumOrder.filter(i => top3[i]).map(i => {
        const r = top3[i];
        const place = i + 1;
        const hClass = place === 1 ? "h1" : place === 2 ? "h2" : "h3";
        return `
          <div class="podium-col ${hClass}">
            <div class="podium-avatar">${r.avatar || initialsOf(r.nome)}</div>
            <div class="podium-name">${r.nome}</div>
            <div class="podium-pts">${r.pontos_total || 0} pts</div>
            <div class="podium-block">${place}</div>
          </div>`;
      }).join("")}
    </div>` : "";

  const restHtml = rest.map((r,i) => `
    <div class="rank-row">
      <div class="rank-pos">${i + 4}</div>
      <div class="rank-name">${r.nome}</div>
      <div class="rank-pts">${r.pontos_total || 0}</div>
    </div>
  `).join("");

  el.innerHTML = `
    ${topbar("ranking")}
    <div class="eyebrow" style="margin-bottom:12px;">RANKING GERAL</div>
    ${podiumHtml}
    ${(rest.length || !top3.length) ? `
      <div class="proof"><div class="cm-bl"></div><div class="cm-br"></div>
        ${restHtml || `<div class="empty-state">Ninguém pontuou ainda.</div>`}
      </div>` : ""}
  `;
  wireTopbar();
}

// ---------------- SET PASSWORD VIEW (invite / recovery link) ----------------
function renderSetPassword(){
  el.innerHTML = `
    ${brandHeader()}
    <div class="mascot-greet">
      <div class="mascot-big">${mascotSVG(72, "happy")}</div>
      <div class="mascot-bubble-big">Bem-vindo(a) à equipe! Só falta criar sua senha.</div>
    </div>
    <div class="proof"><div class="cm-bl"></div><div class="cm-br"></div>
      <div class="eyebrow" style="margin-bottom:16px;">CRIE SUA SENHA</div>
      <div id="auth-error" class="error-msg" style="display:none;"></div>
      <label>Nova senha</label>
      <input type="password" id="f-pass1" placeholder="mínimo 6 caracteres" />
      <label>Confirmar senha</label>
      <input type="password" id="f-pass2" placeholder="repita a senha" />
      <button class="btn full cta" id="btn-setpass">Definir senha e entrar</button>
    </div>
  `;
  const showErr = (msg) => { const e=document.getElementById("auth-error"); e.textContent=msg; e.style.display="block"; };
  document.getElementById("btn-setpass").onclick = async () => {
    const p1 = document.getElementById("f-pass1").value;
    const p2 = document.getElementById("f-pass2").value;
    if(p1.length < 6) return showErr("A senha precisa ter pelo menos 6 caracteres.");
    if(p1 !== p2) return showErr("As senhas não conferem.");
    const { error } = await sb.auth.updateUser({ password: p1 });
    if(error) return showErr(traduzErro(error.message));
    history.replaceState(null, "", window.location.pathname);
    await boot();
  };
}

function parseHashParams(){
  const hash = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : window.location.hash;
  const params = new URLSearchParams(hash);
  return { type: params.get("type"), hasToken: params.has("access_token") };
}

// ---------------- BOOT ----------------
function skeletonDashboard(){
  return `
    <div class="skel skel-chip" style="width:140px;height:20px;margin-bottom:18px;"></div>
    <div class="skel-row"><div class="skel skel-chip"></div><div class="skel skel-chip"></div><div class="skel skel-chip"></div></div>
    <div class="skel-row"><div class="skel skel-tile" style="flex:1"></div><div class="skel skel-tile" style="flex:1"></div></div>
    <div class="skel-row"><div class="skel skel-tile" style="flex:1"></div><div class="skel skel-tile" style="flex:1"></div></div>
  `;
}
async function boot(){
  el.innerHTML = skeletonDashboard();
  await ensureProfile();
  await loadUnidades();
  await loadProgresso();
  await updateStreak();
  checkAchievements();
  state.view = "dashboard";
  render();
}

async function init(){
  const { type, hasToken } = parseHashParams();
  const { data } = await sb.auth.getSession();
  if(data.session && hasToken && (type === "invite" || type === "recovery")){
    state.session = data.session;
    state.view = "set-password";
    render();
    return;
  }
  if(data.session){
    state.session = data.session;
    await boot();
  } else {
    state.view = "auth";
    render();
  }
}
init();
</script>
